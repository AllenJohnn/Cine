<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineView API Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: white;
        }
        .test-section {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #10b981; color: white; }
        .error { background: #ef4444; color: white; }
        .info { background: #3b82f6; color: white; }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #4f46e5;
        }
        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎬 CineView API Test Page</h1>
    <p>Use this page to test if your TMDB API configuration is working correctly.</p>

    <div class="test-section">
        <h2>Configuration Check</h2>
        <div id="config-status"></div>
        <button onclick="checkConfig()">Check Configuration</button>
    </div>

    <div class="test-section">
        <h2>API Endpoint Test</h2>
        <div id="api-status"></div>
        <button onclick="testAPI()">Test API Call</button>
    </div>

    <div class="test-section">
        <h2>Results</h2>
        <div id="results"></div>
    </div>

    <script>
        function checkConfig() {
            const config = {
                hasViteAPIKey: typeof import.meta !== 'undefined' && import.meta.env?.VITE_TMDB_API_KEY ? '✓ Yes' : '✗ No',
                hasViteAPIBase: typeof import.meta !== 'undefined' && import.meta.env?.VITE_TMDB_API_BASE ? '✓ Yes' : '✗ No',
                apiBase: typeof import.meta !== 'undefined' ? import.meta.env?.VITE_TMDB_API_BASE : 'N/A',
                userAgent: navigator.userAgent,
                isMobile: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
            };

            const statusDiv = document.getElementById('config-status');
            statusDiv.innerHTML = `
                <div class="status info">
                    <strong>Environment:</strong><br>
                    VITE_TMDB_API_KEY: ${config.hasViteAPIKey}<br>
                    VITE_TMDB_API_BASE: ${config.hasViteAPIBase}<br>
                    API Base URL: ${config.apiBase || 'Not set'}<br>
                    Device: ${config.isMobile ? 'Mobile' : 'Desktop'}
                </div>
                <pre>${JSON.stringify(config, null, 2)}</pre>
            `;
        }

        async function testAPI() {
            const statusDiv = document.getElementById('api-status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.innerHTML = '<div class="status info">Testing API endpoint...</div>';
            
            try {
                // Test the proxy endpoint
                const response = await fetch('/api/tmdb/trending/movie/week');
                const data = await response.json();
                
                if (response.ok && data.results && data.results.length > 0) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✓ API is working! Found ${data.results.length} movies.
                        </div>
                    `;
                    
                    resultsDiv.innerHTML = `
                        <h3>Sample Movies:</h3>
                        <pre>${JSON.stringify(data.results.slice(0, 3), null, 2)}</pre>
                    `;
                } else {
                    throw new Error('Invalid response or no results');
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        ✗ API Error: ${error.message}<br>
                        <br>
                        <strong>Possible fixes:</strong><br>
                        1. Check that TMDB_API_KEY is set in Vercel environment variables<br>
                        2. Check that VITE_TMDB_API_BASE=/api/tmdb is set<br>
                        3. Verify api/tmdb.js is deployed<br>
                        4. Check Vercel function logs for errors
                    </div>
                `;
                
                resultsDiv.innerHTML = `
                    <h3>Error Details:</h3>
                    <pre>${JSON.stringify({
                        error: error.message,
                        stack: error.stack
                    }, null, 2)}</pre>
                `;
            }
        }

        // Auto-run checks on page load
        window.addEventListener('load', () => {
            checkConfig();
        });
    </script>
</body>
</html>
