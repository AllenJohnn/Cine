<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Primary Meta Tags -->

    <meta name="title" content="CineView Hub - Discover Your Next Favorite Movie or TV Show" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cineviewhub.com/" />
    <meta property="og:title" content="CineView Hub - Discover Your Next Favorite Movie or TV Show" />
    <meta property="og:description" content="Your premium destination for discovering exceptional cinema. Explore millions of movies and TV shows with personalized recommendations." />

    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="CineView Hub - Discover Your Next Favorite Movie or TV Show" />

    <link rel="manifest" href="/site.webmanifest" />

    <link rel="dns-prefetch" href="https://api.themoviedb.org" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cineviewhub.com/" />
